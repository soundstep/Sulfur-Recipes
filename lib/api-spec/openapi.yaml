openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: recipes
    description: Recipe operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /recipes:
    get:
      operationId: getRecipes
      tags: [recipes]
      summary: Get all recipes
      description: Returns all recipes scraped from the Sulfur wiki
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipesResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /recipes/refresh:
    post:
      operationId: refreshRecipes
      tags: [recipes]
      summary: Refresh recipe cache
      description: Clears cache and re-scrapes the Sulfur wiki
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipesResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Recipe:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        variants:
          type: array
          items:
            type: array
            items:
              type: string
      required:
        - name
        - type
        - variants
    RecipesResponse:
      type: object
      properties:
        recipes:
          type: array
          items:
            $ref: "#/components/schemas/Recipe"
        count:
          type: integer
        cachedAt:
          type: string
      required:
        - recipes
        - count
        - cachedAt
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
