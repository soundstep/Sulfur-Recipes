kind = "web"
previewPath = "/"
title = "SULFUR Recipe Finder"
version = "1.0.0"
id = "artifacts/sulfur-recipe-finder"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22056

[services.development]
run = "pnpm --filter @workspace/sulfur-recipe-finder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sulfur-recipe-finder", "run", "build" ]
publicDir = "artifacts/sulfur-recipe-finder/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22056"
BASE_PATH = "/"
